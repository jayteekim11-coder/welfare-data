# 매일 새벽 정부 혜택 데이터를 받아 정리하고, GitHub Pages 로 배포해요.
# (Settings → Pages → Source 를 "GitHub Actions" 로 한 번 설정해야 해요)
name: 혜택 데이터 갱신

on:
  schedule:
    - cron: "37 18 * * *"   # 매일 한국시간 새벽 3시 37분 (UTC 18:37)
  workflow_dispatch:         # Actions 화면에서 [Run workflow] 버튼으로 바로 실행도 가능
  push:
    branches: [main]
    paths: ["scripts/**", "search/**", "site/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 데이터 받고 정리하기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_benefits.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 배포하기
        id: deploy
        uses: actions/deploy-pages@v4
